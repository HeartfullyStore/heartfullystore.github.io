<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf8f5">
<title>Your greeting | HeartfullyStore</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Lora";src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/lora@5.1.1/files/lora-latin-wght-normal.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Lora";src:url("https://cdn.jsdelivr.net/npm/@fontsource-variable/lora@5.1.1/files/lora-latin-wght-italic.woff2") format("woff2");font-weight:400 700;font-style:italic;font-display:swap}

:root{
  /* HeartfullyStore brand: deep plum, warm cream, dusty rose */
  --plum:#471d33; --plum-2:#5d2a45; --cream:#faf8f5; --cream-2:#f1ebe4; --rose:#b89897; --rose-soft:#e9d9d8; --rose-deep:#8e6468;
  /* per-card tint (video frame ring + overlays), set from cards.js */
  --accent:#e6b85c; --tint:#06181f;
  --serif:"Lora",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--plum); background:var(--cream);
  background-image:
    radial-gradient(90% 55% at 50% 0%, #fff 0%, #faf8f500 70%),
    radial-gradient(60% 40% at 100% 100%, var(--rose-soft) 0%, #e9d9d800 70%);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--plum);outline-offset:3px}

/* soft botanical corners, pure decoration */
.flora{position:fixed; width:min(46vw,300px); pointer-events:none; opacity:.5; z-index:0}
.flora.tl{top:-18px; left:-26px}
.flora.br{bottom:-22px; right:-26px; transform:rotate(180deg)}
.flora path{fill:var(--rose)}
.flora path.l{fill:var(--rose-soft)}

.page{
  position:relative; z-index:1; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; padding:4px 6px; min-height:48px; color:var(--plum)}
.brand svg{width:40px; height:40px; flex:none}
.brand b{font-weight:600; font-size:1.375rem; letter-spacing:.005em}
.brand b i{font-style:normal; color:var(--rose-deep)}

.stage{flex:1; display:flex; align-items:center; justify-content:center; width:100%; padding:6px 0}

/* the video frame: always 9:16, as tall as the screen allows */
.frame{
  --h:min(calc(100dvh - 11.5rem), calc((100vw - 2rem) * 16 / 9), 860px);
  position:relative; height:var(--h); aspect-ratio:9/16; max-width:100%;
  border-radius:clamp(18px,4.4vh,30px); overflow:hidden; background:#150a10;
  box-shadow:0 0 0 6px #fff, 0 0 0 7.5px var(--rose-soft), 0 28px 60px -22px #471d3388;
  isolation:isolate;
}
video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#150a10; display:block}

.tap{position:absolute; inset:0; background:none; border:0; cursor:pointer; z-index:2; color:inherit}
.tap[hidden]{display:none}

/* the seal that opens the greeting */
.open{
  position:absolute; inset:0; z-index:4; border:0; cursor:pointer; color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;
  padding-bottom:clamp(34px,9%,70px);
  background:linear-gradient(to top, #1d0a1499 0%, #1d0a1400 42%);
  font-family:inherit; transition:opacity .35s ease, visibility .35s;
}
.open .seal{
  width:clamp(76px,13vh,104px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 34% 28%, #fff 0%, #f3e4e3 40%, #d3b1b0 100%);
  box-shadow:0 10px 28px -6px #000a, inset 0 -3px 6px #8e646888, inset 0 3px 5px #fff;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  animation:breathe 2.8s ease-in-out infinite;
}
.open .seal svg{width:34%; height:34%; margin-left:6%; fill:var(--plum)}
.open .hint{font-style:italic; font-weight:500; font-size:1.125rem; text-shadow:0 2px 12px #000c}
.open:hover .seal{transform:scale(1.06)}
@keyframes breathe{0%,100%{box-shadow:0 10px 28px -6px #000a, 0 0 0 0 #ffffff77, inset 0 -3px 6px #8e646888, inset 0 3px 5px #fff}
  50%{box-shadow:0 10px 28px -6px #000a, 0 0 0 16px #ffffff00, inset 0 -3px 6px #8e646888, inset 0 3px 5px #fff}}
.playing .open,.paused .open,.ended .open,.failed .open,.missing .open{opacity:0; visibility:hidden}
.playing .open .seal{transform:scale(1.7)}

.bar{position:absolute; left:0; right:0; bottom:0; height:4px; background:#ffffff2a; z-index:3; opacity:0; transition:opacity .3s}
.bar i{display:block; height:100%; width:0; background:var(--rose-soft)}
.playing .bar,.paused .bar{opacity:1}

.glyph{position:absolute; z-index:3; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%;
  background:#1d0a14aa; display:grid; place-items:center; opacity:0; pointer-events:none; transition:opacity .25s}
.glyph svg{width:36px;height:36px;fill:#fff}
.paused .glyph{opacity:1}

/* end card and message cards */
.end,.note{
  position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:28px 26px; color:#fff;
  background:linear-gradient(160deg,#471d33f2 0%,#2b1020f5 100%); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.ended .end,.failed .note,.missing .note{display:flex}
.end .heart{width:34px; height:34px; fill:var(--rose)}
.end h1,.note h1{font-style:italic; font-weight:600; font-size:clamp(1.6rem,4.6vh,2.1rem); line-height:1.2; text-wrap:balance}
.end p,.note p{font-size:1.0625rem; line-height:1.55; max-width:30ch; color:#faf8f5d0}
.btn{
  font-family:inherit; font-size:1.0625rem; font-weight:600; color:var(--plum); background:var(--cream); border:0; cursor:pointer;
  padding:13px 26px; min-height:48px; border-radius:999px; box-shadow:0 8px 20px -8px #000a;
}
.btn:hover{background:#fff}
.more{font-size:1rem; color:#fff; text-decoration:underline; text-underline-offset:4px; text-decoration-color:#e9d9d8aa; padding:10px 6px; min-height:44px; display:inline-flex; align-items:center}

/* footer call to action */
.foot{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding-top:4px}
.shop{
  display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:12px 24px; border-radius:999px; text-decoration:none;
  background:var(--plum); color:var(--cream); font-weight:600; font-size:1rem; box-shadow:0 10px 22px -10px #471d33cc;
  transition:background .2s, transform .2s;
}
.shop:hover{background:var(--plum-2); transform:translateY(-1px)}
.shop svg{width:18px;height:18px;fill:var(--rose-soft)}
.foot small{font-size:.9375rem; color:var(--rose-deep); font-style:italic; padding-top:6px}

@media (min-width:900px){
  .frame{--h:min(calc(100dvh - 12rem), 840px)}
}
@media (prefers-reduced-motion:reduce){
  .open .seal{animation:none; transition:none}
  .open,.bar,.glyph,.shop{transition:none}
}

/* ---------- builder cards (?v=): the Atelier look + the 3D opening shot ---------- */
body.hf2{background:#ece5d9;color:#1f1a1b;font-family:HFDisplay,Georgia,serif}
body.hf2 .flora{display:none}
body.hf2 .brand{color:#1f1a1b}
body.hf2 .brand b{font:400 1.6rem/1 HFDisplay,Georgia,serif;letter-spacing:-.01em}
body.hf2 .frame{box-shadow:0 0 0 6px #fbf8f2,0 0 0 7px #d3c6b3,0 30px 60px -24px rgba(60,40,25,.55)}
body.hf2 .end,body.hf2 .note{background:linear-gradient(160deg,rgba(107,34,52,.95),rgba(42,12,20,.97))}
body.hf2 .end h1,body.hf2 .note h1{font:italic 400 clamp(1.9rem,5vh,2.5rem)/1.1 HFDisplay,Georgia,serif;letter-spacing:-.01em}
body.hf2 .end p,body.hf2 .note p{font-family:HFText,Georgia,serif;font-style:italic;font-size:1.2rem}
body.hf2 .btn{border-radius:6px;color:#4f1726;font-family:HFSans,system-ui,sans-serif}
body.hf2 .more,body.hf2 .foot small{font-family:HFSans,system-ui,sans-serif}
body.hf2 .shop{border-radius:6px;background:#6b2234;font-family:HFSans,system-ui,sans-serif;letter-spacing:.01em}
body.hf2 .shop:hover{background:#4f1726}
body.hf2 .foot small{color:#6f6461;font-style:normal;font-size:.875rem}
body.hf2 .bar i{background:#ead8a4}
body.hf2.intro .open{opacity:0;visibility:hidden}
.introHost{position:fixed;inset:0;z-index:50;transition:opacity .5s cubic-bezier(.22,1,.36,1)}
.introHost.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<svg class="flora tl" viewBox="0 0 300 300" aria-hidden="true">
  <path d="M30 20C90 10 150 40 160 110 100 120 40 90 30 20Z"/>
  <path class="l" d="M10 90C60 70 120 110 120 170 70 175 20 150 10 90Z"/>
  <path d="M120 10C170 0 230 30 235 80 185 90 130 65 120 10Z"/>
  <path class="l" d="M60 170C100 160 150 190 150 235 110 240 70 220 60 170Z"/>
</svg>
<svg class="flora br" viewBox="0 0 300 300" aria-hidden="true">
  <path d="M30 20C90 10 150 40 160 110 100 120 40 90 30 20Z"/>
  <path class="l" d="M10 90C60 70 120 110 120 170 70 175 20 150 10 90Z"/>
  <path d="M120 10C170 0 230 30 235 80 185 90 130 65 120 10Z"/>
  <path class="l" d="M60 170C100 160 150 190 150 235 110 240 70 220 60 170Z"/>
</svg>

<div class="page">
  <a class="brand" id="brand" href="#" rel="noopener" aria-label="HeartfullyStore on Etsy">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" fill="none" stroke="#471d33" stroke-width="2.4"/>
      <circle cx="32" cy="32" r="24.5" fill="#faf8f5" stroke="#b89897" stroke-width="1"/>
      <text x="32" y="38.5" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="20" font-weight="600" fill="#471d33">H<tspan fill="#b89897">&#9829;</tspan>S</text>
    </svg>
    <b>Heartfully<i>Store</i></b>
  </a>

  <main class="stage">
    <div class="frame" id="frame">
      <video id="v" playsinline preload="metadata" webkit-playsinline
        controlslist="nodownload noremoteplayback" disablepictureinpicture disableremoteplayback></video>
      <button class="tap" id="tap" type="button" hidden aria-label="Pause or play the greeting"></button>
      <div class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></div>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>

      <button class="open" id="open" type="button" aria-label="Open your greeting and play the video">
        <span class="seal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        <span class="hint">Tap to open your greeting</span>
      </button>

      <section class="end" aria-live="polite">
        <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.7 1.2 5.6 3.3 1.9-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
        <h1 id="endTitle"></h1>
        <p>Made with love, just for you.</p>
        <button class="btn" id="again" type="button">Watch again</button>
        <a class="more" id="more" href="#" rel="noopener">Find more cards at HeartfullyStore</a>
      </section>

      <section class="note" role="alert">
        <h1 id="noteTitle"></h1>
        <p id="noteText"></p>
        <button class="btn" id="retry" type="button" hidden>Try again</button>
        <a class="more" id="more2" href="#" rel="noopener">Visit HeartfullyStore</a>
      </section>
    </div>
  </main>

  <footer class="foot">
    <a class="shop" id="foot" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.7 1.2 5.6 3.3 1.9-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      Send a card of your own
    </a>
    <small>Printable video greeting cards on Etsy</small>
  </footer>
</div>

<script>document.write('<script src="cards.js?v='+Math.floor(Date.now()/60000)+'"><\/script>')</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var frame=$("frame"), v=$("v"), openBtn=$("open"), tap=$("tap"), prog=$("prog");
  var shop=window.SHOP_URL||"#";
  ["brand","more","more2","foot"].forEach(function(id){$(id).href=shop; $(id).target="_blank"});

  // which card? ?c=code   (also accepts #code or ?code)
  var q=new URLSearchParams(location.search), code=(q.get("c")||location.hash.replace("#","")||[].concat(Array.from(q.keys()))[0]||"").trim().toLowerCase();
  var card=(window.CARDS||{})[code];
  // self-serve builder videos (Cloudflare R2 via the Worker): ?v=r123abc&t=Title
  var vid=(q.get("v")||"").trim().toLowerCase();
  if(/^r[a-z0-9]{6}$/.test(vid)){
    card={title:(q.get("t")||"").slice(0,60)||"A message just for you", video:"https://heartfully-builder.yaronb87.workers.dev/v/"+vid+"/video.mp4", poster:"", theme:{}};
  }
  // personalized orders: any 7-character code has its video at the standard address, title from ?t=
  if(!card && /^[a-z0-9]{7}$/.test(code)){
    var t=(q.get("t")||"").slice(0,60);
    card={title:t||"A message just for you", video:"https://f003.backblazeb2.com/file/GreetingCards/"+code+"/video.mp4", poster:"", theme:{}};
  }

  function setState(cls){frame.classList.remove("playing","paused","ended","failed","missing"); if(cls) frame.classList.add(cls)}
  function showNote(cls,title,text,canRetry){
    setState(cls); $("noteTitle").textContent=title; $("noteText").textContent=text; $("retry").hidden=!canRetry;
    openBtn.hidden=true; tap.hidden=true;
  }

  if(!card){
    document.title="Greeting not found | HeartfullyStore";
    showNote("missing","We can’t find this greeting","The link looks incomplete. Scan the QR code on your card again, and make sure the whole code is in view.",false);
    return;
  }

  // optional per-card accent (the page itself always keeps the shop's brand colours)
  var t=card.theme||{};
  if(t.accent) document.documentElement.style.setProperty("--accent",t.accent);

  document.title=card.title+" | HeartfullyStore";
  $("endTitle").textContent=card.title+".";
  v.poster=card.poster; v.src=card.video;
  v.addEventListener("contextmenu",function(e){e.preventDefault()});

  function start(){
    var p=v.play(); setState("playing"); tap.hidden=false;
    if(p&&p.catch) p.catch(function(){setState(null); tap.hidden=true});
  }

  // ---------- builder cards: the 3D opening shot, drawn from the buyer's own card ----------
  // If anything here fails, the page simply keeps its normal "Tap to open" button.
  var API="https://heartfully-builder.yaronb87.workers.dev";
  function opening(){
    if(!/^r[a-z0-9]{6}$/.test(vid)) return false;
    document.body.classList.add("hf2","intro");
    $("brand").innerHTML='<svg viewBox="0 0 100 100" aria-hidden="true" style="filter:drop-shadow(0 1px 1px rgba(60,10,20,.3))"><circle cx="50" cy="50" r="46" fill="#76222f"/><circle cx="50" cy="50" r="31" fill="none" stroke="rgba(30,0,8,.35)" stroke-width="2.4"/><text x="50" y="61" text-anchor="middle" font-family="HFDisplay,Georgia,serif" font-style="italic" font-size="38" fill="rgba(35,2,10,.55)">H</text></svg><b>Heartfully</b>';
    var st=document.createElement("style"); var F="make/fonts/";
    st.textContent="@font-face{font-family:HFDisplay;src:url("+F+"InstrumentSerif-Regular.woff) format('woff');font-weight:100 900;font-display:swap}@font-face{font-family:HFDisplay;src:url("+F+"InstrumentSerif-Italic.woff) format('woff');font-weight:100 900;font-style:italic;font-display:swap}@font-face{font-family:HFText;src:url("+F+"CrimsonPro-Regular.woff) format('woff');font-weight:100 599;font-display:swap}@font-face{font-family:HFText;src:url("+F+"CrimsonPro-Bold.woff) format('woff');font-weight:600 900;font-display:swap}@font-face{font-family:HFText;src:url("+F+"CrimsonPro-Italic.woff) format('woff');font-weight:100 900;font-style:italic;font-display:swap}@font-face{font-family:HFCaps;src:url("+F+"Italiana-Regular.woff) format('woff');font-display:swap}@font-face{font-family:HFSans;src:url("+F+"InstrumentSans-Regular.woff) format('woff');font-weight:100 549;font-display:swap}@font-face{font-family:HFSans;src:url("+F+"InstrumentSans-Bold.woff) format('woff');font-weight:550 900;font-display:swap}";
    document.head.appendChild(st);
    var host=document.createElement("div"); host.className="introHost"; document.body.appendChild(host);
    function load(src){ return new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
    var design=new Promise(function(res){
      var done=false, fin=function(d){ if(!done){ done=true; res(d); } };
      setTimeout(function(){ fin(null); },2500);
      fetch(API+"/v/"+vid+"/card.json").then(function(r){ return r.ok ? r.json() : null; }).then(fin,function(){ fin(null); });
    });
    var giveUp=function(){ document.body.classList.remove("intro"); host.remove(); };
    load("make/vendor/qrcode-generator-2.0.4.js").then(function(){ return load("make/engine.js"); }).then(function(){ return load("make/intro.js"); }).then(function(){ return design; }).then(function(d){
      if(!d || !d.name) d=window.HFIntro.fromTitle(card.title);
      if(!d.msg || !d.msg.length) d.msg=null;
      var started=false, I=window.HFIntro.create(host, d, { qrUrl: location.href, onTap: function(){
        // unlock sound on this tap (phones only allow it inside a tap), then let the camera finish its move
        try{ var p=v.play(); if(p&&p.then) p.then(function(){ if(!started){ v.pause(); v.currentTime=0; } }).catch(function(){}); }catch(e){}
        I.dive().then(function(){ started=true; host.classList.add("gone"); document.body.classList.remove("intro"); v.currentTime=0; start(); setTimeout(function(){ I.destroy(); host.remove(); },600); });
      }});
      return I.play();
    }).catch(giveUp);
    return true;
  }
  openBtn.addEventListener("click",start);
  opening();
  tap.addEventListener("click",function(){ if(v.paused){v.play(); setState("playing")} else {v.pause(); setState("paused")} });
  $("again").addEventListener("click",function(){v.currentTime=0; start()});
  $("retry").addEventListener("click",function(){setState(null); openBtn.hidden=false; v.load(); start()});

  v.addEventListener("timeupdate",function(){ if(v.duration) prog.style.width=(v.currentTime/v.duration*100)+"%" });
  v.addEventListener("ended",function(){setState("ended"); tap.hidden=true; $("again").focus({preventScroll:true})});
  v.addEventListener("error",function(){
    showNote("failed","The video didn’t load","Check your internet connection and try again.",true);
  });
})();
</script>
</body>
</html>
